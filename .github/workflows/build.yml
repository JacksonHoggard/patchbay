name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    permissions:
      contents: write # needed to publish releases on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wii U portlibs
        run: |
          dkp-pacman -Syu --noconfirm --needed \
            wut wiiu-cmake wiiu-pkg-config \
            wiiu-sdl2 wiiu-sdl2_ttf wiiu-sdl2_image wiiu-curl wiiu-mbedtls ppc-zlib \
            ppc-liblzma ppc-bzip2

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^project(PatchBay VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=$tag cmake=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match project(PatchBay VERSION $ver) in CMakeLists.txt"
            exit 1
          fi

      - name: Configure
        run: /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake -B build -S .

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patchbay
          path: |
            build/*.wuhb
            build/*.rpx
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PatchBay ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/patchbay.wuhb
            build/patchbay.rpx
