name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    permissions:
      contents: write # needed to publish releases on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The devkitppc image already ships most portlibs. Only reach for the
      # package server when something is missing: it sometimes rejects CI
      # runners (HTTP 403), so retry a few times.
      - name: Install missing Wii U portlibs
        shell: bash
        run: |
          pkgs="wut wiiu-cmake wiiu-pkg-config wiiu-sdl2 wiiu-sdl2_ttf wiiu-sdl2_image wiiu-curl wiiu-mbedtls ppc-zlib ppc-liblzma ppc-bzip2"
          missing=""
          for p in $pkgs; do dkp-pacman -Q "$p" >/dev/null 2>&1 || missing="$missing $p"; done
          if [ -z "$missing" ]; then echo "All portlibs present"; exit 0; fi
          echo "Installing:$missing"
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm --needed $missing && exit 0
            echo "attempt $i failed; retrying in $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^project(PatchBay VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=$tag cmake=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match project(PatchBay VERSION $ver) in CMakeLists.txt"
            exit 1
          fi

      - name: Configure
        run: /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake -B build -S .

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patchbay
          path: |
            build/*.wuhb
            build/*.rpx
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PatchBay ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/patchbay.wuhb
            build/patchbay.rpx
